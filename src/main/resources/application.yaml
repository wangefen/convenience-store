spring:
  application:
    name: convenience-store

  datasource:
    url:  jdbc:mysql://localhost:3306/convenience_store
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration  #到 db/migration 目录寻找 SQL
    baseline-on-migrate: false    #首次基线已完成，关闭自动接管，避免误接管数据库
    baseline-version: 1
    validate-on-migrate: true   #启动时检查迁移记录与 SQL 文件是否一致

mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml

  configuration:
    map-underscore-to-camel-case: true

logging:
  file:
    name: logs/covenience-store.log

  level:
    root: INFO
    com.store.conveniencestore: DEBUG

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 50
      total-size-cap: 1GB

